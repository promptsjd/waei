[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscenedetect-demo"
dynamic = ["version"]
description = "WAIE: local video editing and storyboards built on the Scene Scribe engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.1,<2",
    "av>=13,<16",
    "scenedetect[opencv]>=0.6.7,<0.8",
]

[project.optional-dependencies]
vision = [
    "transformers==4.49.0",
    "pillow",
    "einops",
    "timm",
]
web = [
    "jsonschema>=4.23,<5",
    "jinja2>=3.1.6,<4",
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "python-multipart>=0.0.18,<0.1",
]
dev = [
    "build>=1.2,<2",
    "setuptools>=68",
    "wheel",
    "ruff>=0.8,<1",
    "requests>=2.32,<3",
]

[project.scripts]
scene-analyzer = "pyscenedetect_demo.cli:main"
scene-report = "pyscenedetect_demo.generate_report:main"
scene-visuals = "pyscenedetect_demo.enrich_visuals:main"
scene-shotlist = "pyscenedetect_demo.cli:shotlist_main"
scene-web = "pyscenedetect_demo.web.main:main"

[project.urls]
Repository = "https://github.com/promptsjd/waei"
Issues = "https://github.com/promptsjd/waei/issues"
Changelog = "https://github.com/promptsjd/waei/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "pyscenedetect_demo.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyscenedetect_demo.web" = ["templates/*.html", "static/js/*.js", "static/css/*.css"]
"pyscenedetect_demo.contract" = ["*.json", "*.md", "examples/*.json", "examples/v1/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F"]
