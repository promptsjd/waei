name: Regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: python -m pip install -e ".[web,dev]"
      - run: python tools/run_checks.py
      - run: node --test tests/editor-ui.test.cjs
      - run: python -m ruff check src tests tools
      - name: Check JavaScript syntax
        run: |
          node --check src/pyscenedetect_demo/web/static/js/app.js
          node --check src/pyscenedetect_demo/web/static/js/editor.js
          node --check src/pyscenedetect_demo/web/static/js/job-detail.js
      - run: python -m build --wheel --no-isolation
      - name: Verify standalone wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path('dist').glob('*.whl'))
          subprocess.run([sys.executable, 'tools/check_wheel.py', str(wheel)], check=True)
